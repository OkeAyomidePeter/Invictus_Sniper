[package]
name = "Invictus"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json","rustls-tls"] }
tokio = { version = "1.29", features = ["full"] }
dotenv = "0.15"
sqlx = { version = "0.6", features = ["runtime-tokio-rustls","sqlite","chrono"] }
solana-sdk = "1.17"
solana-client = "1.17"
spl-token = "4.0"
spl-token-2022 = "3.0"
spl-associated-token-account = "3.0"
teloxide = { version = "0.9", features = ["macros"] }
prometheus = "0.14"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
tokio-tungstenite = "0.20"
futures-util = "0.3"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
bs58 = "0.5"
bincode = "1.3"
base64 = "0.21"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dptree = "0.3"
sysinfo = "0.29"
thiserror = "1.0"
lazy_static = "1.4"
parking_lot = "0.12"
rand = "0.9.2"
